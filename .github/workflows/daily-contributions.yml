name: Daily 5 Contributions

# Runs every day at 10:00 AM IST (04:30 UTC)
on:
  schedule:
    - cron: '30 4 * * *'
  workflow_dispatch: # also allows manual trigger from GitHub UI

permissions:
  contents: write

jobs:
  contribute:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Git identity
        run: |
          git config user.name "Adarsh"
          git config user.email "adarshtripathi249@gmail.com"

      - name: Make 5 daily commits
        run: |
          # ── Commit 1: Update daily changelog ──────────────────────────
          DATE=$(date '+%Y-%m-%d')
          TIME=$(date '+%H:%M:%S UTC')

          mkdir -p logs
          echo "[$DATE $TIME] Daily build — site health check passed." >> logs/changelog.md
          git add logs/changelog.md
          git commit -m "chore: daily site log [$DATE] (1/5)"

          # ── Commit 2: Rotate featured product badge ────────────────────
          PRODUCTS=("Obsidian Oversized Hoodie" "Arctic Fleece Pullover" "Ember Zip-Up Hoodie" "Stone Washed Classic" "Camo Tech Hoodie" "Midnight Crop Hoodie" "Sand Dune Relaxed Fit" "Logo Drop Heavyweight")
          DAY_INDEX=$(( $(date '+%u') - 1 ))
          FEATURED="${PRODUCTS[$DAY_INDEX]}"

          mkdir -p data
          cat > data/featured.json << EOF
          {
            "date": "$DATE",
            "featuredProduct": "$FEATURED",
            "updatedAt": "$TIME"
          }
          EOF
          git add data/featured.json
          git commit -m "feat: rotate featured product → $FEATURED [$DATE] (2/5)"

          # ── Commit 3: Update site meta / SEO timestamp ─────────────────
          cat > data/meta.json << EOF
          {
            "siteName": "Jachyhoo",
            "description": "Premium streetwear hoodies engineered for the culture.",
            "lastUpdated": "$DATE",
            "buildTime": "$TIME",
            "version": "1.0.$(date '+%j')"
          }
          EOF
          git add data/meta.json
          git commit -m "chore: update site meta & build timestamp [$DATE] (3/5)"

          # ── Commit 4: Rotate daily promo banner message ────────────────
          PROMOS=(
            "🔥 Flash Sale — Extra 10% off all hoodies today!"
            "🚀 Free shipping on orders above ₹1999 — Today only!"
            "🎨 New colorways dropping this week — Stay tuned!"
            "⚡ Limited stock alert — Grab yours before it's gone!"
            "🌱 Sustainable drops — Shop guilt-free with Jachyhoo!"
            "🎁 Gift a hoodie — Free gift wrapping this weekend!"
            "👟 New collection teaser — FW2025 is almost here!"
          )
          PROMO_INDEX=$(( $(date '+%u') - 1 ))
          PROMO="${PROMOS[$PROMO_INDEX]}"

          cat > data/promo.json << EOF
          {
            "date": "$DATE",
            "message": "$PROMO",
            "active": true
          }
          EOF
          git add data/promo.json
          git commit -m "feat: daily promo banner updated [$DATE] (4/5)"

          # ── Commit 5: Append to weekly stats log ───────────────────────
          WEEK=$(date '+%Y-W%V')
          cat >> logs/weekly-stats.md << EOF
          | $DATE | $TIME | Auto-build | Healthy | $FEATURED |
          EOF

          # Create weekly stats file with header if it doesn't exist yet
          if [ ! -f logs/weekly-stats.md ]; then
            echo "| Date | Time | Type | Status | Featured |" > logs/weekly-stats.md
            echo "|------|------|------|--------|----------|" >> logs/weekly-stats.md
          fi

          git add logs/weekly-stats.md
          git commit -m "chore: weekly stats log updated [$DATE] (5/5)"

      - name: Push all 5 commits
        run: git push origin main
